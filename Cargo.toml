[package]
name = "snn_core"
version = "0.4.0"
edition = "2024"
authors = ["Zuytan"]
description = "Ultra-low-power, bare-metal spiking neural network (SNN) engine in pure Rust (no_std, zero-alloc runtime, Fix32 saturating fixed-point arithmetic)."
license = "MIT"
repository = "https://github.com/Zuytan/snn_core"
readme = "README.md"
keywords = ["snn", "neuromorphic", "spiking-neural-network", "no_std", "tinyml"]
categories = ["embedded", "no-std", "science"]

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc"]
alloc = []
cortex-m-dsp = []
cortex-m-helium = []
cortex-m0 = []
riscv-dsp = []

[dependencies]

[lints]
workspace = true

[workspace]
members = [".", "crates/snn_core_bptn", "demos"]
# Standalone packages: the C ABI crate keeps the library name `snn_core` (libsnn_core.a),
# the firmware targets another architecture and edition, the codegen tool has its own dependencies.
exclude = ["crates/snn_core_c", "examples/wio_e5_benchmark", "tools/snn_core_codegen"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_feature, values("mve"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_lines = "allow"
inline_always = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
items_after_statements = "allow"
uninlined_format_args = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

