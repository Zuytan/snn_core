[package]
name = "snn_core"
version = "0.4.0"
edition = "2024"
authors = ["Zuytan"]
description = "Ultra-low-power, bare-metal spiking neural network (SNN) engine in pure Rust (no_std, zero-alloc runtime, Fix32 saturating fixed-point arithmetic)."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Zuytan/snn_core"
readme = "README.md"
keywords = ["snn", "neuromorphic", "spiking-neural-network", "no_std", "tinyml"]
categories = ["embedded", "no-std", "science"]

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "bptn"]
alloc = []
bptn = []
cortex-m-dsp = []
cortex-m-helium = []
cortex-m0 = []
riscv-dsp = []


[dependencies]

[dev-dependencies]
criterion = "0.5"
fastrand = { version = "2.3.0", default-features = false }
nalgebra = { version = "0.33.2" }

[[bench]]
name = "network_benchmark"
harness = false
required-features = ["alloc"]

[[example]]
name = "01_lif_reservoir"
required-features = ["alloc"]

[[example]]
name = "05_shd_cochlea_benchmark"
required-features = ["alloc"]

[[example]]
name = "06_tinyml_vs_snn_head_to_head"
required-features = ["alloc"]

[[example]]
name = "07_nir_aot_codegen"
required-features = ["alloc"]

[[example]]
name = "08_dwt_hardware_profiling"
required-features = ["alloc"]

[[example]]
name = "09_bptn_vs_lif_head_to_head"
required-features = ["alloc", "bptn"]

[[example]]
name = "10_bptn_long_horizon_memory"
required-features = ["alloc", "bptn"]

[[example]]
name = "11_bptn_global_pipeline"
required-features = ["alloc", "bptn"]

[[example]]
name = "12_cyber_can_ids_killer_benchmark"
required-features = ["alloc", "bptn"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_feature, values("mve"))'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_lines = "allow"
inline_always = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
items_after_statements = "allow"
uninlined_format_args = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

